name: Build patched ClashBar (arm64)

# 触发方式：定时 + 手动。
# 故意没有 push 触发 —— 这样上传/覆盖本文件不会再产生额外 run，也不会打断正在跑的任务。
# 定时：UTC 22:00 = 北京时间次日 06:00（GitHub cron 一律用 UTC，不认夏令时）。
on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      bundle_core:
        description: 'Bundle mihomo core (1 = full build, 0 = smaller no-core build)'
        required: false
        default: '1'
        type: choice
        options:
          - '1'
          - '0'
      dmg_suffix:
        description: 'Suffix used in the DMG filename'
        required: false
        default: 'apple-silicon-patched4'
        type: string

jobs:
  build-arm64:
    runs-on: macos-15-intel
    permissions:
      contents: read
    steps:
      - name: Checkout upstream v0.3.6 source
        uses: actions/checkout@v4
        with:
          repository: Sitoi/ClashBar
          ref: v0.3.6

      - name: Write and apply remote-import fix
        shell: bash
        run: |
          set -euo pipefail
          git --version
          git log -1 --format='Building from %h %s'
          cat > /tmp/clashbar-fix.patch <<'CLASHBAR_PATCH_EOF'
