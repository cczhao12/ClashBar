      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Verify Swift toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
          if ! swift --version | grep -Eq 'Swift version (6\.[2-9]|[7-9]\.)'; then
            echo "Swift 6.2+ is required by Package.swift." >&2
            exit 1
          fi

      - name: Build app (arm64)
        shell: bash
        env:
          APP_VERSION: 0.3.6
          BUILD_NUMBER: 1
          TARGET_ARCH: arm64
          PREPARE_MIHOMO_BINARY: ${{ github.event_name == 'workflow_dispatch' && inputs.bundle_core || '1' }}
          BUNDLE_MIHOMO_BINARY: ${{ github.event_name == 'workflow_dispatch' && inputs.bundle_core || '1' }}
        run: ./Scripts/build.sh app

      - name: Build DMG
        shell: bash
        env:
          APP_VERSION: 0.3.6
          DMG_SUFFIX: ${{ github.event_name == 'workflow_dispatch' && inputs.dmg_suffix || 'apple-silicon-patched4' }}
        run: ./Scripts/build.sh dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: ClashBar-patched-dmg
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
          if-no-files-found: error

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: ClashBar-patched-app
          path: dist/ClashBar.app/
          if-no-files-found: error
